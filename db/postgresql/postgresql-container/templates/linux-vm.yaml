# Linux VirtualMachine template (clone from source DV + blank data disk for PostgreSQL datadir).
# Placeholders filled by postgresql_tests.provision. Data-disk blocks are injected
# when attach_data_disk=true (default for PostgreSQL).
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ${vm_name}
  namespace: ${namespace}
  labels:
    postgresql-container.ioscale/managed: "true"
    postgresql-container.ioscale/os: linux
    postgresql-container.ioscale/run: "${run_id}"
    postgresql-container.ioscale/role: vm
spec:
  runStrategy: RerunOnFailure
  dataVolumeTemplates: []  # filled programmatically
  template:
    metadata:
      labels:
        postgresql-container.ioscale/managed: "true"
        postgresql-container.ioscale/os: linux
        postgresql-container.ioscale/run: "${run_id}"
        postgresql-container.ioscale/role: vm
    spec:
      architecture: amd64
      domain:
        cpu:
          cores: ${vm_cpu}
        resources:
          requests:
            memory: ${vm_memory}
        devices:
          disks: []  # filled programmatically
          interfaces:
          - name: default
            masquerade: {}
            bootOrder: 2
        machine:
          type: pc-q35-rhel9.4.0
      networks:
      - name: default
        pod: {}
      volumes: []  # filled programmatically
