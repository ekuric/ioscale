# Source DataVolume for Linux VMs (registry containerdisk). Applied by mariadb_tests.provision.
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: ${dv_name}
  namespace: ${namespace}
  labels:
    mariadb-container.ioscale/managed: "true"
    mariadb-container.ioscale/os: linux
    mariadb-container.ioscale/run: "${run_id}"
    mariadb-container.ioscale/role: source-dv
  annotations:
    cdi.kubevirt.io/storage.deleteAfterCompletion: "false"
    cdi.kubevirt.io/storage.bind.immediate.requested: "true"
spec:
  source:
    registry:
      url: "docker://${vm_image}"
  storage:
    accessModes:
    - ${access_mode}
    resources:
      requests:
        storage: ${storage_size}
    storageClassName: ${storage_class}
