# Minimal MSSQL HammerDB Windows Configuration (mssqlwin_tests / mssqlwin.py)

description: ""

database:
  # Choose ONE of: hosts, host_pattern, host_labels, host_file
  # Or omit hosts and use provision.create_vms / --create-vms
  hosts: "vm1 vm2"        # Space-separated list of hosts
  # host_pattern: "winvm-{1..3}"          # Expands to winvm-1 winvm-2 winvm-3
  # host_labels: "app=mssql,role=primary" # OpenShift VM labels (virtctl)
  # host_file: "mssql_hosts.txt"          # File with one host per line
  namespace: "default"  # only used for virtctl mode
  warehouse_count: 50            # Number of warehouses for TPCC test
  build_users: 50                # Virtual users for schema build step
  mssql_total_iterations: 10000000              # Number of iterations to run
  test_duration: 15              # Test duration in minutes
  # rampup_time: 2               # Ramp-up time in minutes (defaults to template)
  user_count: "1 10 20 50 100"   # Space-separated list of user counts to test, eg "1 2 4 8"
  # iterations: 1                    # Repeat full user_count sweep N times (*_run1 … *_runN)
  # iteration_sleep_sec: 60          # Sleep between sweep iterations (0=off)
  # vu_sleep_sec: 30                 # Sleep between VU levels within an iteration (0=off)
  # mssql_pass: "Password123"       # MSSQL server password
# max_parallel_workers: 0            # Unset/0 = all hosts; positive N caps concurrency

windows:
  hammerdb_path: "C:\\tools\\Hammerdb-4.12"
  test_script: "C:\\tools\\Hammerdb-4.12\\hammertest.ps1"
  hammerdb_test_script: "C:\\tools\\Hammerdb-4.12\\mssqls_tprocc_run10.tcl"
  build_schema_file: "C:\\tools\\Hammerdb-4.12\\mssqls_tprocc_buildschema.tcl"
  result_dir: "C:\\tools\\Hammerdb-4.12\\results"
  rebuild_script: "C:\\tools\\Hammerdb-4.12\\rebuild-db.ps1"
  create_db_sql: "C:\\tools\\Hammerdb-4.12\\create_db.sql"
  disk_id: "1"  # data disk id to format (ignored when use_osdisk: true)
  # use_osdisk: true  # TPCC on C:\mssql\data; skip D: provision (or USE_OSDISK=true / --osdisk)
  ssh_user: "Administrator"
  # mssql_service_name: "MSSQLSERVER"  # Optional service name override
  rebuilddb: true
  # rebuild_timeout: 7200  # Optional timeout in seconds (omit to disable)
  rebuild_always: false
  rebuild_only: false
  test_only: false

# Optional Windows Performance Monitor collectors (BLG under result_dir; relog → CSV post-test).
# Enable via YAML, --perfmon, or PERFMON=true in the container.
# perfmon:
#   enabled: true
#   sample_interval: 5
#   counters_file: /work/perfmon-counters-default.txt
#   until_iteration: 1
#   export_csv: true
#   collector_name: mssqlwin-perfmon

# Timeout configuration (all values in seconds)
# Uncomment to override defaults
timeouts:
  default: 300            # Default command timeout
  scp: 300                # SCP file copy timeout
  test: 7200              # Test execution timeout per user count
  prepare: 1200           # Machine preparation timeout
  vm_lookup: 10           # VM lookup timeout (oc get vm/vmi)
  label_query: 30         # Label-based VM query timeout
  oc_command: 15          # OpenShift/virsh command timeout (vm-dump, pod list)
# On-demand Windows VMs (optional). Prefer CLI/env: --create-vms / CREATE_VMS=true
# Flow: source image or existing snap → VolumeSnapshot → clone root DV per VM
# (same pattern as fio-windows / winCdisk --golden-snapshot).
# provision:
#   create_vms: true
#   vms: 3
#   vm_prefix: mssql-win
#   vm_cpu: "8"
#   vm_memory: 16Gi
#   storage_class: ocs-storagecluster-ceph-rbd-virtualization
#   access_mode: ReadWriteMany
#   # ONE of:
#   win_vm_image: "https://example.com/win2k25-mssql.qcow2"
#   # golden_snapshot: windv-snap
#   # orig_vm: gold-win-mssql
#   # snapshot_class: ocs-storagecluster-rbd  # optional auto-detect
#   win_root_volume_size: 100Gi
#   win_data_disk_size: 40Gi
#   cleanup: false
