# Minimal MSSQL HammerDB Windows Configuration (mssqlwin.py)

description: ""

database:
  # Choose ONE of: hosts, host_pattern, host_labels, host_file
  hosts: "vm1 vm2"        # Space-separated list of hosts
  # host_pattern: "winvm-{1..3}"          # Expands to winvm-1 winvm-2 winvm-3
  # host_labels: "app=mssql,role=primary" # OpenShift VM labels (virtctl)
  # host_file: "mssql_hosts.txt"          # File with one host per line
  namespace: "default"  # only used for virtctl mode 
  warehouse_count: 50            # Number of warehouses for TPCC test
  mssql_total_iterations: 10000000              # Number of iterations to run
  test_duration: 15              # Test duration in minutes
  user_count: "1 10 20 50 100"   # Space-separated list of user counts to test, eg "1 2 4 8"
  # mssql_pass: "Password123"       # MSSQL server password

windows:
  hammerdb_path: "C:\\tools\\Hammerdb-4.12"
  test_script: "C:\\tools\\Hammerdb-4.12\\hammertest.ps1"
  hammerdb_test_script: "C:\\tools\\Hammerdb-4.12\\mssqls_tprocc_run10.tcl"
  build_schema_file: "C:\\tools\\Hammerdb-4.12\\mssqls_tprocc_buildschema.tcl"
  result_dir: "C:\\tools\\Hammerdb-4.12\\results"
  rebuild_script: "C:\\tools\\Hammerdb-4.12\\rebuild-db.ps1"
  create_db_sql: "C:\\tools\\Hammerdb-4.12\\create_db.sql"
  disk_id: "1"  # data disk id to format and use for testing
  ssh_user: "Administrator"
  rebuilddb: true
  rebuild_only: false
  test_only: false

