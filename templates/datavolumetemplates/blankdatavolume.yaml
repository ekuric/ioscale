apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: blankdv
  namespace: default
spec:
  source:
    blank: {}
  pvc:
    accessModes:
      - ReadWriteMany
    resources:
      requests:
        storage: 10Gi
    storageClassName: ocs-storagecluster-ceph-rbd-virtualization
    volumeMode: Block
